# News Crawler Workflow
# Runs every 30 minutes to crawl news sites and update Firebase
name: News Crawler

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      force_run:
        description: 'Force run all crawlers'
        required: false
        default: 'false'

jobs:
  crawl-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # Leave 5 minutes buffer before 30-minute limit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libgtk-3-0

      - name: Run news crawlers
        env:
          # Firebase credentials
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          
          # API keys (if needed for future crawlers)
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          
          # Puppeteer configuration
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "🚀 Starting news crawler workflow..."
          echo "📅 Current time: $(date)"
          echo "🔄 Force run: ${{ github.event.inputs.force_run }}"
          
          # Run the crawler service
          npm run crawl:github-actions

      - name: Upload crawler logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs-${{ github.run_number }}
          path: |
            crawler-logs.txt
            error-logs.txt
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Crawler workflow failed at $(date)"
          echo "Check the logs for details"
          # You can add Slack/Discord webhook notifications here if needed
